# M4 - (C4) Worker Cloudflare des notifications push (offre gratuite).
# Le secret SERVICE_ACCOUNT (clé du compte de service Firebase) se met avec :
#   npx wrangler secret put SERVICE_ACCOUNT < chemin/vers/la-cle.json
# Il n'est JAMAIS dans ce dépôt.
name = "houmani-push"
main = "src/index.js"
compatibility_date = "2025-09-01"

# (IA) Cloudflare Workers AI (offre gratuite) pour l'assistant du leader
[ai]
binding = "AI"

# Limites d'appels par utilisateur et par jour (src/limites.js) : compteurs
# dans Cloudflare KV (offre gratuite). Tant que ce bloc est en commentaire,
# le Worker marche SANS limite (il l'écrit dans le journal).
# Pour l'activer : créer l'espace KV "houmani-limites" (Cloudflare →
# Storage & Databases → Workers KV → Create), copier son ID ici, puis
# enlever les # des 3 lignes ci-dessous.
# [[kv_namespaces]]
# binding = "LIMITES"
# id = "COLLER_ICI_L_ID_DE_L_ESPACE_KV"

# (IA) L'analyse automatique : chaque lundi à 7h (UTC) = 8h en Tunisie
[triggers]
crons = ["0 7 * * 1"]
